# CI: Linux x86_64, Linux arm64, and macOS on Apple Silicon.
#
# slang is built primarily for servers, which mostly run Linux, and until
# this workflow existed it had only ever been built and tested on Intel
# macOS. The first Linux run found three bugs that had shipped: a committed
# macOS binary a Linux checkout tried to execute, every program failing to
# link under GCC -flto (C functions called only from assembly were
# discarded), and a long long / int64_t mismatch in the JSON decoder.
#
# arm64 was worse: it did not build on any platform, Apple Silicon
# included, because the preemption and stack-growth trampolines existed
# only in x86_64 assembly. Both arm64 runners are native here -- local
# Docker could only emulate them.
#
# Runs on merge to main, and on manual dispatch (which runs the workflow as
# it exists on the chosen branch -- how a change to this file is tried
# before it merges). Nothing here may reach the internet: a test that needs
# the network fails for reasons unrelated to the code, which is why the
# https client checks are verified by hand instead.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # cc is GCC on Linux and clang on macOS, so the suite's generated-C
      # warning sweep checks both compilers' warnings.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev \
            zlib1g-dev git python3

      # No PKG_CONFIG_PATH: slangc locates Homebrew's keg-only OpenSSL
      # itself (find_openssl, src/main.c), and the suite should run the way
      # a user's machine would.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3

      - name: Toolchain
        run: |
          uname -sm
          cc --version | head -1
          pkg-config --modversion openssl

      - name: Build slangc
        run: make slangc

      - name: Test suite
        run: make test

      # With pkg-config unable to see OpenSSL, slangc must still find it
      # itself: Homebrew's prefix on macOS, the system headers on Linux.
      # Before the fallback existed this failed with "openssl/sha.h file not
      # found" -- the first error a new macOS user met with https.
      - name: OpenSSL discovery without pkg-config
        env:
          PKG_CONFIG_LIBDIR: /nonexistent
          PKG_CONFIG_PATH: ""
        run: |
          mkdir -p /tmp/ossl && cp tests/crypto/main.sl /tmp/ossl/main.sl
          ./slangc /tmp/ossl/main.sl --run    # no pipe: the exit status must be slangc's

      # The suite's own preemption probe loops with cooperative yields, so
      # it never takes the async signal path at all. Deep recursion has no
      # loop back-edges, and oversubscribing the cores makes the ticker
      # fire: this is the check that the preemption trampoline and its
      # resume path restore every register. Fails if no async preemption
      # happened, since then it proved nothing.
      - name: Async preemption
        run: |
          mkdir -p /tmp/async && cat > /tmp/async/main.sl <<'EOF'
          fn fib(n: int) -> int {
              if n < 2 {
                  return n;
              }
              return fib(n - 1) + fib(n - 2);
          }
          fn work(n: int) -> int {
              return fib(n);
          }
          let hs: [join[int]] = [];
          let i = 0;
          while i < 64 {
              push(hs, spawn work(30));
              i = i + 1;
          }
          let total = 0;
          for h in hs {
              let r = join_wait(h);
              guard let v = r else { println("FAIL: a task panicked"); exit(1); }
              total = total + v;
          }
          println(total);
          EOF
          ./slangc /tmp/async/main.sl -o /tmp/async/t
          seen=0
          for run in 1 2 3 4 5; do
            out=$(SLANG_SCHED_STAT=1 SLANG_PREEMPT_QUANTUM_MS=1 \
                  SLANG_PREEMPT_TICK_MS=1 /tmp/async/t 2>&1)
            total=$(printf '%s\n' "$out" | grep -E '^[0-9]+$' || true)
            n=$(printf '%s\n' "$out" | grep -o 'async_preempts=[0-9]*' | cut -d= -f2)
            echo "run $run: total=$total async_preempts=$n"
            if [ "$total" != "53250560" ]; then
              echo "wrong result -- registers were not restored"; exit 1
            fi
            seen=$((seen + ${n:-0}))
          done
          if [ "$seen" -eq 0 ]; then
            echo "no async preemption happened; this step proved nothing"; exit 1
          fi

      - name: Docs build
        run: make docs

  # Attach a tarball per platform to a published release.
  release-tarballs:
    if: github.event_name == 'release'
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev zlib1g-dev

      - name: Build tarball
        run: make dist

      # Verify the tarball the way a user gets it: unpacked somewhere
      # unrelated, compiling and running a program with the installed layout
      # rather than the source tree.
      - name: Verify tarball
        run: |
          mkdir -p /tmp/verify && tar -xzf dist/*.tar.gz -C /tmp/verify
          bin=$(echo /tmp/verify/*/bin)
          mkdir -p /tmp/verify/proj && cd /tmp/verify/proj
          "$bin/slangc" --version
          "$bin/slangc" new demo >/dev/null
          cd demo && "$bin/slangc" main.sl --run

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.tar.gz --clobber
