# Linux CI.
#
# slang is built primarily for servers, which mostly run Linux, and until
# this workflow it had only ever been built and tested on macOS. The first
# Linux run found three bugs that had shipped: a committed macOS binary a
# Linux checkout tried to execute, every program failing to link under
# GCC -flto (C functions called only from assembly were discarded), and a
# long long / int64_t mismatch in the JSON decoder.
#
# x86_64 only for now. arm64 does not build on ANY platform -- Linux or
# Apple Silicon: the async-preemption and stack-growth trampolines exist
# only in x86_64 assembly (runtime/sl_sched.c), so every program fails to
# link. That is a port, tracked in next-steps.md; its job goes back into
# both matrices below when it lands, rather than sitting here failing on
# every merge.
#
# Runs on merge to main. Nothing here may reach the internet -- a test
# that needs the network fails for reasons unrelated to the code, which is
# why the https client checks are verified by hand instead.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # cc is GCC here, not clang: the generated-C warning sweep in the
      # suite therefore checks GCC's warnings as well as clang's on macOS.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev \
            zlib1g-dev git python3

      - name: Toolchain
        run: |
          uname -m
          cc --version | head -1
          pkg-config --modversion openssl

      - name: Build slangc
        run: make slangc

      - name: Test suite
        run: make test

      - name: Docs build
        run: make docs

  # Attach a Linux tarball per architecture to a published release. The
  # macOS tarball is still built and attached by hand.
  release-tarballs:
    name: release tarball (${{ matrix.arch }})
    if: github.event_name == 'release'
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev zlib1g-dev

      - name: Build tarball
        run: make dist

      # Verify the tarball the way a user gets it: unpacked somewhere
      # unrelated, compiling and running a program with the installed
      # layout rather than the source tree.
      - name: Verify tarball
        run: |
          mkdir -p /tmp/verify && tar -xzf dist/*.tar.gz -C /tmp/verify
          bin=$(echo /tmp/verify/*/bin)
          mkdir -p /tmp/verify/proj && cd /tmp/verify/proj
          "$bin/slangc" --version
          "$bin/slangc" new demo >/dev/null
          cd demo && "$bin/slangc" main.sl --run

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.tar.gz --clobber
