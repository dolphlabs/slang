# Scratch branch: how long minors wait for workers on GitHub runners.
# Never merged.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    name: diag ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential pkg-config libssl-dev libsqlite3-dev zlib1g-dev
          make slangc
          ./slangc tests/gc_nursery_rendezvous/main.sl -o /tmp/r 2>/dev/null
          nproc; uname -r; grep -m1 "model name" /proc/cpuinfo || true
      - name: Stats
        run: |
          for cfg in "4 0" "4 0-1" "4 all" "8 0-1" "2 0" "1 0"; do
            set -- $cfg
            for i in 1 2; do
              if [ "$2" = all ]; then pre=""; else pre="taskset -c $2"; fi
              line=$(SLANG_WORKERS=$1 SLANG_GC_STAT=1 $pre /tmp/r 2>&1 >/dev/null | grep "minor_collects=")
              echo "workers=$1 cpus=$2 $(echo "$line" | grep -oE "minor_collects=[0-9]+|nursery_threshold=[0-9]+|minor_pause_ns_total=[0-9]+" | tr '\n' ' ') $(SLANG_WORKERS=$1 SLANG_GC_STAT=1 $pre /tmp/r 2>&1 >/dev/null | grep -oE "minor_ttsp_ns=[0-9]+|minor_sweep_ns=[0-9]+|minor_mark_ns=[0-9]+" | tr '\n' ' ')"
            done
          done
