# Scratch branch: diagnoses the Autobahn fuzzing server's OOM on some
# ubuntu-24.04 runner images. Never merged.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket:
    name: websocket ${{ matrix.gc }} ${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
        gc: [nursery]
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -r
          nproc; free -m
          grep -E "model name|cache size" /proc/cpuinfo | sort -u
          for f in enabled defrag khugepaged/defrag; do
            echo "thp $f: $(cat /sys/kernel/mm/transparent_hugepage/$f)"
          done
          cat /proc/sys/vm/overcommit_memory
          docker version --format 'docker server {{.Server.Version}}'
          docker info --format 'cgroup {{.CgroupVersion}} {{.CgroupDriver}}'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev zlib1g-dev

      - name: Build slangc
        run: make slangc

      - name: Start the Autobahn fuzzing server
        run: |
          mkdir -p /tmp/autobahn
          case "${{ matrix.gc }}" in
            nursery) gcenv="-e PYPY_GC_NURSERY=4M" ;;
            *) gcenv="" ;;
          esac
          docker run -d --name fuzzingserver -p 9001:9001 $gcenv \
            -v "$GITHUB_WORKSPACE/tests/live/websocket:/config:ro" -v /tmp/autobahn:/reports \
            crossbario/autobahn-testsuite wstest -m fuzzingserver -s /config/fuzzingserver.json
          ok=0
          for i in $(seq 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ $ok -eq 1 ] || { docker logs fuzzingserver | tail -30; exit 1; }
          pid=$(docker inspect fuzzingserver -f '{{.State.Pid}}')
          nohup sudo sh -c "while kill -0 $pid 2>/dev/null; do
              echo \$(date +%T) \$(grep -E '^(Rss|AnonHugePages):' /proc/$pid/smaps_rollup | tr -s ' ' | tr '\n' ' ') \$(grep -E '^(Rss|VmHWM)' /proc/$pid/status | tr -s ' \t' ' ' | tr '\n' ' ')
              sleep 3
            done" > /tmp/mem.txt 2>&1 &

      - name: Live test
        run: |
          ./slangc tests/live/websocket/main.sl --run
          python3 tests/live/websocket/check.py /tmp/autobahn/clients/index.json

      - name: Fuzzing server memory
        if: always()
        run: |
          docker inspect fuzzingserver --format \
            'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' || true
          awk 'NR % 5 == 1' /tmp/mem.txt
          tail -3 /tmp/mem.txt
          sudo dmesg | grep -iE "oom|killed process" | tail -5 || true
