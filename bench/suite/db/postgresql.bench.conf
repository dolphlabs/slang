# Appended to postgresql.conf by setup_host.sh. Sized for a dedicated
# database core budget; the same for every language.
max_connections = 300
shared_buffers = 4GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 1GB
synchronous_commit = off        # writes are measured, durability is not the subject
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 15min
max_wal_size = 8GB
random_page_cost = 1.1
jit = off                        # keeps plan times flat and identical across runs
